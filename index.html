<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pay ₹1</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:#f3f4f7;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:white;
padding:30px;
border-radius:25px;
width:320px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.profile{
display:flex;
align-items:center;
justify-content:center;
gap:12px;
margin-bottom:20px;
}

.profile img{
width:55px;
height:55px;
border-radius:50%;
object-fit:cover;
}

.profile h2{
margin:0;
font-size:32px;
font-weight:500;
color:#333;
}

.qr{
width:100%;
border-radius:20px;
margin-top:10px;
}

p{
color:#555;
font-size:16px;
margin-top:20px;
}

button{
margin-top:20px;
width:100%;
padding:16px;
font-size:18px;
border:none;
border-radius:14px;
background:#0F9D58;
color:white;
cursor:pointer;
font-weight:bold;
}

button:hover{
opacity:0.95;
}

</style>
</head>

<body>

<div class="card">

<div class="profile">

<img src="https://i.imgur.com/6VBx3io.png">

<h2>Jaspreet Kaur</h2>

</div>

<img class="qr"
src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=upi://pay?pa=jaspreet18aug-1@okaxis&pn=Jaspreet%20Kaur&am=1&cu=INR">

<p>
Scan to pay ₹1 with any UPI app
</p>

<button onclick="openUPI()">
Open Google Pay
</button>

</div>

<script>

function openUPI(){

const upi =
"upi://pay?pa=jaspreet18aug-1@okaxis&pn=Jaspreet%20Kaur&am=1&cu=INR";

window.location.href = upi;

}

window.onload = function(){

setTimeout(function(){

openUPI();

},1000);

}

</script>

</body>
</html>
