<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pay ₹1</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:#f3f4f7;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:white;
padding:25px;
border-radius:25px;
text-align:center;
width:340px;
box-shadow:0 10px 30px rgba(0,0,0,0.12);
}

.qr{
width:280px;
border-radius:20px;
cursor:pointer;
transition:0.3s;
}

.qr:hover{
transform:scale(1.03);
}

h2{
margin-bottom:10px;
color:#222;
}

p{
color:#666;
font-size:15px;
margin-top:15px;
}

.button{
display:block;
margin-top:20px;
background:#0F9D58;
color:white;
padding:15px;
border-radius:14px;
text-decoration:none;
font-size:18px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="card">

<h2>Pay ₹1</h2>

<!-- CLICKABLE QR -->

<img
class="qr"
src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=upi://pay?pa=jaspreet18aug-1@okaxis&pn=Jaspreet%20Kaur&am=1&cu=INR"
onclick="openUPI()"
>

<p>
Tap QR to open payment app<br>
or scan using any UPI app
</p>

<a class="button" href="#" onclick="openUPI()">
Open Google Pay
</a>

</div>

<script>

function openUPI(){

const ua = navigator.userAgent.toLowerCase();

// ANDROID → DIRECT GOOGLE PAY

if(ua.includes("android")){

window.location.href =
"intent://pay?pa=jaspreet18aug-1@okaxis&pn=Jaspreet%20Kaur&am=1&cu=INR#Intent;scheme=upi;package=com.google.android.apps.nbu.paisa.user;end";

}

// IPHONE

else{

window.location.href =
"upi://pay?pa=jaspreet18aug-1@okaxis&pn=Jaspreet%20Kaur&am=1&cu=INR";

}

}

</script>

</body>
</html>
