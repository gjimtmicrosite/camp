<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pay ₹1</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:white;
padding:30px;
border-radius:25px;
text-align:center;
width:320px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

img{
width:220px;
margin-top:15px;
}

button{
margin-top:20px;
width:100%;
padding:15px;
font-size:18px;
background:#0F9D58;
color:white;
border:none;
border-radius:12px;
}

</style>
</head>

<body>

<div class="card">

<h2>Pay ₹1</h2>

<p>If app does not open, scan QR</p>

<img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=upi://pay?pa=jaspreet18aug-1@okaxis&pn=Jaspreet%20Kaur&am=1&cu=INR">

<button onclick="payNow()">
Open Google Pay
</button>

</div>

<script>

function payNow(){

var userAgent = navigator.userAgent || navigator.vendor || window.opera;

// ANDROID
if (/android/i.test(userAgent)) {

window.location.href =
"intent://pay?pa=jaspreet18aug-1@okaxis&pn=Jaspreet%20Kaur&am=1&cu=INR#Intent;scheme=upi;package=com.google.android.apps.nbu.paisa.user;end";

}

// IPHONE
else if (/iPad|iPhone|iPod/.test(userAgent)) {

window.location.href =
"upi://pay?pa=jaspreet18aug-1@okaxis&pn=Jaspreet%20Kaur&am=1&cu=INR";

}

// OTHER
else{

window.location.href =
"upi://pay?pa=jaspreet18aug-1@okaxis&pn=Jaspreet%20Kaur&am=1&cu=INR";

}

}

window.onload = function(){

setTimeout(function(){

payNow();

},1000);

}

</script>

</body>
</html>
